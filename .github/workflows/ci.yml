name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: humble
            platform: linux/amd64
          - distro: jazzy
            platform: linux/amd64
          - distro: humble
            platform: linux/arm64   # UPC (Jetson Orin, Ubuntu 22.04)
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (rby1-sdk via scripts/install_rby1_sdk.sh, rosdep, colcon build)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: ROS_DISTRO=${{ matrix.distro }}
          tags: rby1-ros2:${{ matrix.distro }}
          load: true
          cache-from: type=gha,scope=${{ matrix.distro }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.distro }}-${{ matrix.platform }}
      - name: Test
        run: |
          docker run --rm rby1-ros2:${{ matrix.distro }} bash -c \
            "cd /ws && colcon test --event-handlers console_cohesion+ --return-code-on-test-failure"

  native-build:
    # Local (non-Docker) build path, as on the UPC.
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base
    steps:
      - uses: actions/checkout@v7
        with:
          path: src/rby1-ros2
      - name: Install rby1-sdk
        run: |
          apt-get update && apt-get install -y build-essential cmake git python3-venv
          bash src/rby1-ros2/scripts/install_rby1_sdk.sh --prefix /opt/rby1-sdk
      - name: Build
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          rosdep update && rosdep install --from-paths src --ignore-src -y
          colcon build --cmake-args -DRBY1_SDK_ROOT=/opt/rby1-sdk
